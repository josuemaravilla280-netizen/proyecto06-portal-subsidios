name: Verificación Sprint 1
on: [push, pull_request]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check src/server.js
      - run: node --check src/routes/auth.js
      - run: node --check src/routes/beneficiarios.js
      - run: node --check src/routes/programas.js
      - run: node --check public/js/app.js
