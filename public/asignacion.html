<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega y Asignación de Beneficios</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

  <div class="panel-app">
    
    <header class="barra-app">
      <div>
        <h1>Asignación de Beneficios</h1>
      </div>
    </header>

    <!-- Formulario superior -->
    <section class="section">
      <form id="formBuscar" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
        <label>Entidad responsable <select id="fEntidad"></select></label>
        <label>Programa <select id="fPrograma"></select></label>
        <label>Beneficiario (documento) <input id="fBeneficiario" type="text"></label>
        <button type="submit" hidden></button>
      </form>
    </section>

    <header class="barra-app" style="margin-top:18px">
      <div><span class="tag-portal">PORTAL MULTIEMPRESA</span><p>Detalle de asignación</p></div>
      <div style="display:flex;gap:9px"><button id="btnCerrar" class="btn-secundario">Cerrar ventana</button></div>
    </header>
    <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

    <section class="vista-panel" style="margin-top:18px">
      <h2 id="titulo">Asignación</h2>
      <div style="display:flex;gap:24px;flex-wrap:wrap">
        <div style="flex:1;min-width:280px">
          <h3>Requisitos del programa</h3>
          <ul id="listaPrograma" class="datos-lista"></ul>
        </div>
        
        <div style="flex:1;min-width:280px">
          <h3>Requisitos de la inscripción</h3>
          <ul id="listaInscripcion" class="datos-lista"></ul>
        </div>

      </div>

      <div class="section">
        <textarea id="motivo" class="oculto" rows="3" style="width:100%"
          placeholder="Motivo de la cancelación. Para enviar sin motivo, presione «Cancelar» de nuevo."></textarea>
      </div>
      <div style="display:flex;gap:9px;margin-top:12px">
        <button id="btnAprobar" class="btn" disabled>Aprobar</button>
        <button id="btnCancelar" class="btn-secundario" disabled>Cancelar</button>
      </div>
    </section>
  </div>

  <footer><span>Subsidios · ayudas</span><div class="links-footer"><a href="#">Privacidad y tratamiento de datos</a><a href="#">Condiciones de uso</a></div></footer>
  <script src="js/common.js" defer></script>
  <script src="js/asignacion.js" defer></script>
</body>

</html>
