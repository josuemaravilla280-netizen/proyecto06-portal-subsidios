<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa - Portal de Subsidios</title>
  <link rel="stylesheet" href="../css/estilos.css"><link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <main class="panel-app">
    <header class="barra-app"><div><span class="tag-portal">PORTAL MULTIEMPRESA</span><h1 id="tNombre">Programa</h1><p id="datosUsuario"></p></div><button id="btnCerrar" class="btn-secundario">Cerrar ventana</button></header>
    <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

    <section class="vista-panel" style="margin-top:18px">
      <h2>Información</h2>
      <div class="info-programa" style="margin-top:14px">
        <div><span>Tipo de programa</span><strong id="iTipo"></strong></div>
        <div><span>Cupos máximos</span><strong id="iCupos"></strong></div>
        <div class="full"><span>Entrega</span><strong id="iEntrega"></strong></div>
        <div class="full"><span>Descripción</span><strong id="iDescripcion"></strong></div>
      </div>
    </section>

    <section class="vista-panel">
      <div class="graficos" id="graficos"></div>
    </section>
  </main>
  <footer><span>Subsidios · ayudas</span><div class="links-footer"><a href="#">Privacidad y tratamiento de datos</a><a href="#">Condiciones de uso</a></div></footer>
  <script src="../js/dashboards/programa.js" defer></script>
</body>
</html>
